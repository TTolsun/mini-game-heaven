site_name: mini-game-heaven SDD
docs_dir: docs/sdd
site_dir: build/site
theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - 시작: index.md
  - 코드로 확인한 구조:
      - 시스템 개요: overview.md
      - 컴포넌트 구조와 책임: components.md
      - 핵심 시나리오: scenarios/index.md
      - 컴파일 플래그 매트릭스: feature-flags.md
      - 스레드와 콜백 모델: threading.md
  - 사람이 기록한 설계:
      - 변경 시 지켜야 할 제약: constraints.md
      - 설계 결정 기록: decisions.md

# 선택 사항: Ollama(qwen3.5:4b)가 있는 로컬 러너를 등록한 뒤에만 켭니다.
# GitHub 호스트 러너는 개발자 머신의 localhost 에 닿을 수 없습니다.
name: docs-sync

on:
  workflow_dispatch:
    inputs:
      force:
        description: '전체 절을 다시 쓴다'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'docs/sdd-config/**'
      - 'sdd.yaml'
      - 'tools/**'
      - '.github/workflows/docs-sync.yml'

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_id == '1374451618' && github.ref == 'refs/heads/main' && vars.DOCGEN_LOCAL_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, docgen-qwen]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned SDD engine
        run: bash tools/setup-sdd.sh
      - name: Refresh native compile database
        run: bash gradlew assembleDebug --no-daemon
      - name: 로컬 Qwen 동기화
        run: |
          args=()
          if [[ "${{ inputs.force }}" == "true" ]]; then args+=(--force); fi
          bash tools/docs-sync.sh "${args[@]}"
      - name: PR 생성
        uses: peter-evans/create-pull-request@v7
        with:
          branch: docs/sdd-sync
          title: "docs: local Qwen SDD sync (${{ github.run_id }})"
          commit-message: "docs: sync SDD with local Qwen"
          body: |
            로컬 Qwen 동기화 결과입니다. 절마다 `파일:줄` 인용을 코드와 대조해 검토하세요.
            `status: needs-review` 인 문서부터 봅니다. 검토 후 `node tools/docs-review.mjs accept
            --reviewer NAME --reason TEXT`로 현재 코드·문서의 해시와 검토자를 기록하세요.
            남겨야 하는 정적 분석 한계는 `--acknowledge docs/sdd/threading.md=REASON`으로 명시합니다.
            `tools/docs-check.sh`를 통과한 결과를 커밋하세요. 자동 동기화는 검토 기록을 승인하지 않습니다.
          labels: documentation

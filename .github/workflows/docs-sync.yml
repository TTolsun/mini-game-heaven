# 선택 사항: Ollama(qwen3.5:4b)가 있는 로컬 러너를 등록한 뒤에만 켭니다.
# GitHub 호스트 러너는 개발자 머신의 localhost 에 닿을 수 없습니다.
name: docs-sync

on:
  workflow_dispatch:
    inputs:
      force:
        description: '전체 절을 다시 쓴다'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'docs/sdd-config/**'
      - 'sdd.yaml'
      - '.github/workflows/docs-sync.yml'

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'TTolsun/mini-game-heaven' && github.ref == 'refs/heads/main' && vars.DOCGEN_LOCAL_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, docgen-qwen]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 로컬 Qwen 동기화
        env:
          # 러너 머신에 camera-hal-sdd 가 clone 되어 있어야 합니다 (기본: 이 저장소 옆).
          SDD_TOOL_DIR: ${{ vars.SDD_TOOL_DIR }}
        run: |
          args=()
          if [[ "${{ inputs.force }}" == "true" ]]; then args+=(--force); fi
          bash tools/docs-sync.sh "${args[@]}"
      - name: PR 생성
        uses: peter-evans/create-pull-request@v7
        with:
          branch: docs/sdd-sync
          title: "docs: local Qwen SDD sync (${{ github.run_id }})"
          commit-message: "docs: sync SDD with local Qwen"
          body: |
            로컬 Qwen 동기화 결과입니다. 절마다 `파일:줄` 인용을 코드와 대조해 검토하세요.
            `status: needs-review` 인 문서부터 봅니다. 검토가 끝나면 frontmatter 의 status 를 ok 로 바꾸고,
            `tools/docs-sync.sh --site` 로 docs/index.html 을 다시 만든 뒤 함께 커밋하세요.
          labels: documentation

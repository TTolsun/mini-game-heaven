name: docs-check

# Required checks run on every PR, including policy-only changes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865 cmake;3.31.6"
      - name: Policy regression tests
        run: node --test tools/policy.test.mjs
      - name: Native SRPG model tests
        run: |
          mkdir -p build
          g++ -std=c++20 -Wall -Wextra -Wpedantic -O2 -I native native/tests/BattleModelTests.cpp native/app/srpg/BattleModel.cpp -o build/srpg-model-tests
          ./build/srpg-model-tests build
      - name: Install pinned SDD engine
        run: bash tools/setup-sdd.sh
      - name: Build, unit tests, and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleRelease --no-daemon
      - name: Documentation and review checks
        run: bash tools/docs-check.sh --ci

# camera-hal-sdd 파이프라인 설정 (monster-garden 용).
# 도구 저장소(C:\Users\baboe\git\camera-hal-sdd)가 이 저장소 옆에 clone 되어 있다고 가정한다.
# 실행: uv run --project ../camera-hal-sdd sdd --config ./sdd.yaml <명령>
# 로컬에서만 다른 값을 쓰려면 sdd.local.yaml 에 같은 구조로 덮어쓴다 (git 제외).

source:
  # C++ 소스 루트. 패키지 = 이 아래 첫 디렉터리 (engine / app / platform). facts 의 file:line 과 impact 의 diff 경로는 이 루트 기준이다.
  root: ./native
  # 사실에서 뺄 파일 (소스 루트 기준 glob).
  exclude: ["third_party/**", "tests/**", "app/games/**", "app/scenes/**", "app/MiniGameApp.*", "app/GameRegistry.*", "app/GameAssets.*", "app/HighScores.*", "app/IMiniGame.h", "app/ui/**"]
  # tools/sync-compile-commands.sh 가 Gradle/CMake 빌드 결과에서 복사해 둔 파일.
  compile_commands: ./compile_commands.json
  ndk_build:
    enabled: false

output:
  facts_dir: build/sdd/facts
  sdd_dir: docs/sdd
  diagrams_dir: docs/sdd/diagrams

paths:
  # 섹션과 시나리오는 이 프로젝트 것을 쓰고, 프롬프트·뼈대·집필 규칙은 도구 저장소 것을 그대로 쓴다.
  sections_file: ./docs/sdd-config/sections.yaml
  scenarios_file: ./docs/sdd-config/scenarios.yaml
  clang_uml_file: ../camera-hal-sdd/config/clang-uml.yaml
  prompts: ../camera-hal-sdd/prompts
  templates: ../camera-hal-sdd/templates
  style: ../camera-hal-sdd/style

tools:
  clang_uml: clang-uml      # PATH 에 없으면 libclang 대체 경로로 자동 전환된다.

agent:
  kind: ollama
  model: qwen3.5:4b
  base_url: http://localhost:11434
  max_input_chars: 18000
  temperature: 0.1
  timeout_sec: 600
  num_ctx: 16384
  full_style_guides: false

review:
  require_citations: true
  max_retries: 2

# App scenarios for the martial-arts SRPG prototype.
defaults:
  glob: ["**/*.cpp"]
  depth: 4
scenarios:
  - id: android_main
    title: 앱 시작과 메인 루프
    from: "android_main(android_app *)"
    depth: 3
  - id: frame
    title: 한 프레임과 전투 화면
    from: "engine::Engine::frame()"
    depth: 5
  - id: touch
    title: 터치 입력 전달
    from: "engine::Engine::onTouch(int32_t, engine::TouchEvent::Phase, float, float)"
  - id: command
    title: 이동·행동과 상대 응답의 원자적 처리
    from: "app::srpg::BattleModel::execute(app::srpg::Command)"
  - id: progression
    title: 배움을 유지하며 다음 수련 시작
    from: "app::srpg::BattleModel::nextLesson()"
  - id: load_assets
    title: 한국어 글꼴과 수련 상태 불러오기
    from: "app::srpg::BattleScene::onEnter(engine::Engine &)"
  - id: preview
    title: 모델 복사본으로 명령 결과 예측
    from: "app::srpg::BattleModel::preview(app::srpg::Command)"
    depth: 3
  - id: save
    title: 확정된 턴과 배움 저장
    from: "app::srpg::BattleModel::save(const std::string &)"

# App scenarios for the monster collection game.
defaults:
  glob: ["**/*.cpp"]
  depth: 4
scenarios:
  - id: android_main
    title: 앱 시작과 메인 루프
    from: "android_main(android_app *)"
    depth: 3
  - id: frame
    title: 한 프레임과 자동 방어
    from: "engine::Engine::frame()"
    depth: 5
  - id: touch
    title: 터치 입력 전달
    from: "engine::Engine::onTouch(int32_t, engine::TouchEvent::Phase, float, float)"
  - id: start_game
    title: 방어전 시작
    from: "app::castle::CastleModel::startRaid()"
  - id: show_result
    title: 방어 결과와 보상
    from: "app::castle::CastleModel::finishRaid()"
  - id: load_assets
    title: 한국어 글꼴과 저장된 성 불러오기
    from: "app::castle::CastleScene::onEnter(engine::Engine &)"
  - id: dodge_update
    title: 마물과 용사의 자동 전투
    from: "app::castle::CastleModel::update(float)"
    depth: 3
  - id: fusion
    title: 마물 합성과 도감 등록
    from: "app::castle::CastleModel::fuse(int, int)"
